[supervisord]
nodaemon=true
# Runs as root inside the container; saying so silences the startup warning
user=root
# Supervisor's own messages still go to stdout (nodaemon); no log file needed
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
# Even though we set stdout/stderr, the key is the symlink or direct Nginx config
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:python]
command=python -u /app/get_text.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
